name: Docs

# Rebuild whenever anything the site is made of changes. Only main is
# published — there is one site, and it should reflect main.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - mkdocs.yml
      - mkdocs_hooks.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

# The default GITHUB_TOKEN cannot publish Pages without these.
permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, and never cancel one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      # Only the docs group — the site build has no use for torch and the rest
      # of the runtime dependencies.
      - name: Install MkDocs
        run: uv sync --only-group docs

      # --strict turns broken links and pages missing from the nav into build
      # failures, so the site cannot rot silently.
      - name: Build site
        run: uv run --no-sync mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
