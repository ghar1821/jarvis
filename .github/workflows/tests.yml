name: Tests

# Only guard main: direct pushes to it, and PRs that want to land there.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch supersedes whatever run is still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    # A cold run installs torch and downloads two models; anything past this
    # is a hang, not slowness.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Caches the resolved dependency downloads, keyed off uv.lock.
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      # The KB tests use the real embedding model and cross-encoder reranker
      # rather than mocks (see docs/TESTING.md). Together that's a ~220 MB
      # download on a cold cache, so keep it between runs.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-bge-small-en-v1.5-ms-marco-MiniLM-L6-v2

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest -m "not integration"
