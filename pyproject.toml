[project]
name = "jarvis"
version = "0.1.0"
description = "Your vault and papers as a read-only knowledge base for MCP clients"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.33.1",
    "chromadb>=0.6.0",
    "sentence-transformers>=3.0.0",
    "langchain-chroma>=0.1.0",
    "langchain-huggingface>=0.1.0",
    "langchain-text-splitters>=0.3.0",
    "arxiv>=4.0.0",
    "pymupdf4llm>=1.28.0",
    "pymupdf>=1.28.0",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "mcp>=2.3",
    "uvicorn>=0.18.3",
    "fastapi>=0.115.9",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[project.scripts]
kb          = "jarvis.kb.cli:main"
jarvis-mcp  = "jarvis.mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]
docs = ["mkdocs-material>=9.6,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_settle: run the real file-settle poll instead of the instant stub"]
